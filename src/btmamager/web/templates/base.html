<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}btmamager{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
</head>
<body>
  {% set path = request.url.path %}
  <header class="container-fluid topbar">
    <nav>
      <ul><li><strong>🌱 btmamager</strong></li></ul>
      <ul>
        <li><a href="/" {% if path == "/" %}aria-current="page"{% endif %}>Status</a></li>
        <li><a href="/settings" {% if path.startswith("/settings") %}aria-current="page"{% endif %}>Settings</a></li>
      </ul>
    </nav>
  </header>
  <main class="container-fluid">
    {% if not s.configured %}
    <div class="warn-box"><p><strong>Configuration needed.</strong> Set the approved tracker on the
      <a href="/settings">Settings</a> page; nothing is paused or resumed until then.</p></div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
