[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "btmamager"
version = "0.1.0"
description = "Keep qBittorrent seeding only MyAnonamouse torrents: every recent one, then the largest, up to a target count."
requires-python = ">=3.11"
dependencies = [
    "qbittorrent-api>=2024.9",
    "requests>=2.31",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
btmamager = "btmamager.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/btmamager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
